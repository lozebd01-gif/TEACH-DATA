<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net; worker-src blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co https://cdn.jsdelivr.net blob:; frame-src 'none'; object-src 'none'; base-uri 'none'">
<title>TEACH DATA</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--pr:#ff1a5c;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1a1d27;--tx:#eceef4;--mu:#9aa1b2;--pr:#ff4d85;--bd:#2a2e3b}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
button{font:inherit;cursor:pointer}
.b{display:block;width:100%;padding:13px;border:0;border-radius:13px;background:var(--pr);color:#fff;font-weight:700;font-size:16px}
.b:disabled{opacity:.6}.b.s{background:var(--bd);color:var(--tx)}.b.d{background:#dc2626}
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff;color:#111;text-align:center;position:relative;overflow:hidden}
#lg::before,#lg::after{content:"";position:absolute;border-radius:50%}
#lg::before{width:280px;height:280px;background:#ff1a5c;opacity:.1;top:-100px;right:-90px}
#lg::after{width:300px;height:300px;background:#33e680;opacity:.18;bottom:-110px;left:-100px}
#lg input{background:#fff;color:#111;border-color:#ddd}
.lc{position:relative;z-index:1;max-width:380px;width:100%}.lc img{width:100%;max-width:320px}
.bar{display:flex;height:5px;border-radius:9px;overflow:hidden;margin:12px auto 16px;max-width:120px}.bar i{flex:1}
.lc p{color:#555;font-size:14px;margin:0 0 14px}
#lm{min-height:22px;font-size:14px;margin:6px 0}#lm.e{color:#d11}#lm.o{color:#0a8f4a}
.lk{background:none;border:0;color:#555;text-decoration:underline;margin-top:10px}
header{position:sticky;top:0;background:var(--bg);padding:10px 14px 4px;z-index:5}
.hr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hr span{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px}
.hr img{height:30px;background:#fff;border-radius:8px;padding:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.chip{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:6px 14px 80px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.bk{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer}
.cv{height:100px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:#fff;font-weight:700;line-height:1.25}
.inf{padding:8px 10px 10px}.inf b{display:block;font-size:14px}.inf small{color:var(--mu)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bd);margin-top:4px}
.em{text-align:center;color:var(--mu);padding:40px 14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mu);font-size:13px}nav button.on{color:var(--pr);font-weight:700}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sh{background:var(--card);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px}
.sh .b{margin-top:10px;text-align:center;text-decoration:none}.sh img.pv{width:100%;border-radius:12px;margin-bottom:10px}
#pa{padding:6px 14px 90px}label{font-size:13px;color:var(--mu)}
.tabs{display:flex;background:#f0f0f3;border-radius:14px;padding:4px;margin:0 0 14px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:700;color:#666}
.tabs button.on{background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 -3px 0 #ff1a5c}
.lc h2{margin:0 0 6px;font-size:21px}
header{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#111,#ff1a5c,#33e680) 1}
.hero{position:relative;overflow:hidden;margin:10px 14px 6px;padding:16px;border-radius:18px;background:#0b0b0f;color:#fff;display:flex;justify-content:space-between;align-items:center}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:#ff1a5c;opacity:.2}
.hero small{color:#33e680;font-weight:600}.hero h3{margin:4px 0;font-size:19px}.hero span{font-size:13px;color:#cfd3dc}
.hero .hx{position:relative;z-index:1;width:84px;height:84px;color:#33e680}
.cv{position:relative;height:120px;flex-direction:column;align-items:flex-start;justify-content:flex-end;text-align:left;overflow:hidden;padding:10px}
.cv em{position:absolute;top:8px;left:10px;font-style:normal;font-size:10px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:99px;font-weight:700}
.cv strong{font-size:14px;position:relative;z-index:1}
.cv .hx{position:absolute;right:-16px;top:-8px;width:82px;height:82px;color:rgba(255,255,255,.35)}
nav button.on{box-shadow:inset 0 3px 0 var(--pr)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 4px}
.st div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;font-size:12px;color:var(--mu)}
.st b{display:block;font-size:22px;color:var(--pr)}
#pm h3{margin:18px 0 8px;font-size:16px;border-left:4px solid var(--pr);padding-left:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row span{display:flex;flex-direction:column;min-width:0}.row small{color:var(--mu);font-size:12px;word-break:break-all}
#rd{position:fixed;inset:0;z-index:30;background:#3a3d46;display:flex;flex-direction:column}
.rb{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:3px solid var(--pr)}
.rb b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.rb #rp{font-size:12px;color:var(--mu);white-space:nowrap}
#rv{flex:1;overflow:auto;padding:8px;-webkit-overflow-scrolling:touch}
.pg{background:#fff;margin:0 0 8px;box-shadow:0 2px 8px rgba(0,0,0,.35)}.pg canvas{display:block}
</style>
</head>

const colr=l=>{const n='১২৩৪৫৬৭৮'.indexOf((l.match(/ক্লাস (.)/)||[])[1]);

// ---------- লগইন (OTP) ----------
function back(){$('s1').hidden=false;$('s2').hidden=true;msg('')}

async function sendOtp(){
  const s2=!$('s2').hidden;
  const nm=$('nm').value.trim(),em=(s2?mail:$('em').value.trim()).toLowerCase();
  if(mode==='up'&&nm.length<2){msg('সঠিক নাম দিন','e');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){msg('সঠিক ইমেইল দিন','e');return}
  if(DEMO){mail=em;toStep2();return}
  if(!sb)return;
  $('bs').disabled=true;msg('পাঠানো হচ্ছে…');
  const opts=mode==='up'?{shouldCreateUser:true,data:{full_name:nm}}:{shouldCreateUser:false};
  const {error}=await sb.auth.signInWithOtp({email:em,options:opts});

  mail=em;toStep2()}

  const q=$('q').value.trim().toLowerCase();
  const list=books.filter(b=>(page!=='fav'||favs.includes(b.id))&&(lv==='সব'||b.level===lv)&&(ty==='সব'||b.kind===ty)&&(!q||((b.title||'')+' '+(b.author||'')+' '+(b.subject||'')).toLowerCase().includes(q)));
  $('gr').innerHTML=list.map(b=>'<div class="bk" data-id="'+b.id+'">'+cover(b)+'<div class="inf"><b>'+esc(b.title)+'</b><small>'+esc(b.author||'—')+'</small><br><span class="tag">'+esc(b.kind)+'</span>'+(favs.includes(b.id)?' ❤️':'')+'</div></div>').join('');
  $('cnt').textContent=books.length+' টি বই · সব শ্রেণি';
  const e=$('ee');e.hidden=list.length>0;e.textContent=page==='fav'?'এখনো কোনো প্রিয় বই নেই':'কোনো বই পাওয়া যায়নি'}
async function openB(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  const f=favs.includes(id);
  $('sh').innerHTML='<div id="pvw"></div><h2 style="margin:0 0 4px">'+esc(b.title)+'</h2><div style="color:var(--mu)">'+esc(b.author||'—')+'</div><p>বিষয়: '+esc(b.subject||'—')+'<br>স্তর: '+esc(b.level)+'<br>ধরন: '+esc(b.kind)+'</p><div id="lkw"></div><button class="b s" id="fv">'+(f?'💔 প্রিয় থেকে সরান':'❤️ প্রিয়তে রাখুন')+'</button>'+(isAdmin?'<button class="b d" id="dl">🗑️ মুছুন</button>':'')+'<button class="b s" id="cl">বন্ধ করুন</button>';
  $('md').hidden=false;
  $('fv').onclick=()=>{const i=favs.indexOf(id);i>=0?favs.splice(i,1):favs.push(id);try{localStorage.setItem('td_favs',JSON.stringify(favs))}catch(e){}closeM();draw()};
  $('cl').onclick=closeM;
  if(isAdmin)$('dl').onclick=()=>delBook(b);
  $('lkw').innerHTML=(DEMO&&!b.fileUrl)?'<p style="color:var(--mu)">ডেমো নমুনা বই — এতে কোনো ফাইল নেই</p>':'<button class="b" id="rd1">📖 অ্যাপে পড়ুন</button><button class="b s" id="dl1">⬇️ ডাউনলোড</button>';
  if($('rd1')){$('rd1').onclick=()=>openReader(b);$('dl1').onclick=()=>doDownload(b)}}
// ---------- রিডার ও ডাউনলোড ----------
const PJ='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
let pdfl=null,rzm=1,rdoc=null,rbk=null,rio=null;
async function fileUrl(b,dl){
  if(DEMO){if(!b.fileUrl)throw 0;return b.fileUrl}
  const {data,error}=await sb.storage.from('books').createSignedUrl(b.file_path,3600,dl?{download:dl}:undefined);
  if(error||!data)throw error;return data.signedUrl}
async function loadPdf(){
  if(pdfl)return pdfl;
  await new Promise((ok,no)=>{const s=document.createElement('script');s.src=PJ+'pdf.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  const w=await(await fetch(PJ+'pdf.worker.min.js')).text();
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));
  return pdfl=window.pdfjsLib}
async function openReader(b){
  rbk=b;rzm=1;$('rd').hidden=false;$('rt').textContent=b.title;$('rp').textContent='';
  $('rv').innerHTML='<div class="em" style="color:#fff">লোড হচ্ছে…</div>';
  try{
    const url=await fileUrl(b);
    if(b.file_type.startsWith('image/')){$('rv').innerHTML='<img src="'+esc(url)+'" style="width:100%;background:#fff" alt="">';return}
    const lib=await loadPdf();
    const buf=await(await fetch(url)).arrayBuffer();
    rdoc=await lib.getDocument({data:buf}).promise;layout()
  }catch(e){$('rv').innerHTML='<div class="em" style="color:#fff">ফাইল খোলা যায়নি। ⬇️ ডাউনলোড করে দেখুন।</div>'}}
function layout(){
  const rv=$('rv');rv.innerHTML='';if(rio)rio.disconnect();
  rdoc.getPage(1).then(p=>{
    const v=p.getViewport({scale:1}),W=Math.max(280,(rv.clientWidth-16)*rzm),h=W*v.height/v.width;
    rio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const d=e.target;$('rp').textContent=d.dataset.n+'/'+rdoc.numPages;if(!d.dataset.r){d.dataset.r=1;paint(d,W)}}),{root:rv,rootMargin:'600px 0px'});
    for(let i=1;i<=rdoc.numPages;i++){const d=document.createElement('div');d.className='pg';d.dataset.n=i;d.style.width=W+'px';d.style.height=h+'px';rv.appendChild(d);rio.observe(d)}})}
async function paint(d,W){
  const pg=await rdoc.getPage(+d.dataset.n),v0=pg.getViewport({scale:1}),dpr=Math.min(window.devicePixelRatio||1,2),v=pg.getViewport({scale:W/v0.width*dpr});
  const c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.width=W+'px';c.style.height=(v.height/dpr)+'px';
  await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;d.style.height='auto';d.innerHTML='';d.appendChild(c)}
function closeR(){$('rd').hidden=true;if(rio)rio.disconnect();if(rdoc){rdoc.destroy();rdoc=null}$('rv').innerHTML=''}
async function doDownload(b){
  try{
    const nm=(b.title||'book').replace(/[^\p{L}\p{N} _.-]+/gu,'_').slice(0,80)+(EXT[b.file_type]||'');
    const url=await fileUrl(b,nm);
    const a=document.createElement('a');a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove()
  }catch(e){alert('ডাউনলোড ব্যর্থ')}}
$('rx').onclick=closeR;$('rdl').onclick=()=>rbk&&doDownload(rbk);
$('zp').onclick=()=>{if(rdoc){rzm=Math.min(3,rzm*1.25);layout()}};
$('zm').onclick=()=>{if(rdoc){rzm=Math.max(.6,rzm/1.25);layout()}};
function closeM(){$('md').hidden=true}
async function addBook(){
  if(!isAdmin)return;
  if(DEMO){const t=$('a-t').value.trim(),f=$('a-f').files[0];if(!t){alert('নাম দিন');return}books.unshift({id:'d'+Date.now(),title:t,author:$('a-a').value.trim(),subject:$('a-s').value.trim(),level:$('a-l').value,kind:$('a-y').value,file_type:f?f.type:'application/pdf',fileUrl:f?URL.createObjectURL(f):''});['a-t','a-a','a-s','a-f'].forEach(i=>$(i).value='');setPage('home');return}
  const t=$('a-t').value.trim(),f=$('a-f').files[0];
  if(!t||!f){alert('নাম ও ফাইল দিন');return}
  if(!EXT[f.type]){alert('শুধু PDF, JPG, PNG বা WEBP চলবে');return}
  if(f.size>20*1024*1024){alert('ফাইল ২০ MB-র বেশি');return}
  const bt=$('ba');bt.disabled=true;bt.textContent='আপলোড হচ্ছে…';
  const path=crypto.randomUUID()+EXT[f.type];
  try{
    let r=await sb.storage.from('books').upload(path,f,{contentType:f.type,upsert:false});if(r.error)throw r.error;
    r=await sb.from('books').insert({title:t,author:$('a-a').value.trim()||null,subject:$('a-s').value.trim()||null,level:$('a-l').value,kind:$('a-y').value,file_path:path,file_type:f.type});
    if(r.error){await sb.storage.from('books').remove([path]);throw r.error}
    ['a-t','a-a','a-s','a-f'].forEach(i=>$(i).value='');
    await loadBooks();setPage('home');alert('বই যোগ হয়েছে ✅')
  }catch(e){alert('আপলোড ব্যর্থ')}
  bt.disabled=false;bt.textContent='বই যোগ করুন'}
async function delBook(b){
  if(!isAdmin||!confirm('বইটি মুছে ফেলবেন?'))return;
  if(DEMO){books=books.filter(x=>x.id!==b.id);closeM();draw();return}
  const r=await sb.from('books').delete().eq('id',b.id);
  if(r.error){alert('মুছতে ব্যর্থ');return}
  await sb.storage.from('books').remove([b.file_path]);
  favs=favs.filter(x=>x!==b.id);closeM();await loadBooks();draw()}
async function renderAdm(){
  if(!isAdmin)return;
  let us=[];
  if(DEMO)us=[{full_name:'রাহিম',email:'rahim@example.com',created_at:'2026-11-09'},{full_name:'সুমি',email:'sumi@example.com',created_at:'2026-11-10'}];
  else{const r=await sb.from('profiles').select('full_name,email,created_at').order('created_at',{ascending:false}).limit(200);us=r.data||[]}
  
  $('pm').innerHTML='<div class="st"><div><b>'+books.length+'</b>মোট বই</div><div><b>'+us.length+'</b>ইউজার</div><div><b>'+new Set(books.map(b=>b.level)).size+'</b>শ্রেণি/স্তর</div><div><b>'+books.filter(b=>b.kind==='পাঠ্যবই').length+'</b>পাঠ্যবই</div><div><b>'+books.filter(b=>b.kind==='গাইড').length+'</b>গাইড</div></div><h3>ইউজার তালিকা</h3>'+(us.map(u=>'<div class="row"><span><b>'+esc(u.full_name||'—')+'</b><small>'+esc(u.email)+'</small></span><small>'+esc((u.created_at||'').slice(0,10))+'</small></div>').join('')||'<div class="em">কোনো ইউজার নেই</div>')+'<h3>বই ম্যানেজ</h3>'+(books.map(b=>'<div class="row"><span><b>'+esc(b.title)+'</b><small>'+esc(b.level)+' · '+esc(b.kind)+'</small></span><button class="chip" data-del="'+b.id+'">🗑️ মুছুন</button></div>').join('')||'<div class="em">কোনো বই নেই</div>')}
function setPage(p){
  page=p;const a=p==='add',m=p==='adm';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('ph').hidden=a||m;$('pa').hidden=!a;$('pm').hidden=!m;$('hp').hidden=a||m;
  if(m)renderAdm();else if(!a)draw();scrollTo(0,0)}

document.addEventListener('click',e=>{
  const dl=e.target.closest('[data-del]');if(dl){const b=books.find(x=>x.id===dl.dataset.del);if(b)delBook(b).then(renderAdm);return}
  const tb=e.target.closest('.tabs button');if(tb){setMode(tb.dataset.m);return}
  const c=e.target.closest('.chip[data-f]');if(c){c.dataset.f==='l'?lv=c.dataset.v:ty=c.dataset.v;draw();return}
  const k=e.target.closest('.bk');if(k){openB(k.dataset.id);return}
  const n=e.target.closest('nav button');if(n){setPage(n.dataset.p);return}
  if(e.target===$('md'))closeM()});

if(DEMO){books=DEMO_BOOKS;msg('ডেমো প্রিভিউ: যেকোনো ইমেইল দিন, OTP কোড 123456','o')}
else{
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>{s?boot(s):showLogin()},0)})}
setMode('in');
</script>
